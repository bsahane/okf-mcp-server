apiVersion: v1
kind: ConfigMap
metadata:
  name: okf-mcp-server-config
  labels:
    app: okf-mcp-server
    component: mcp-server
data:
  MCP_PORT: "5001"
  PYTHON_LOG_LEVEL: "INFO"
  MCP_TRANSPORT_PROTOCOL: "http"
  CORS_ENABLED: "true"
  ENVIRONMENT: "production"
  # With auth disabled the server only answers loopback Host/Origin, so the
  # Route returns 421 by design. Shared access needs OAuth plus per-user
  # permission filtering (PLAN.md phase 5); until then tools fail closed
  # when ENABLE_AUTH is true.
  ENABLE_AUTH: "false"
  SSO_CALLBACK_URL: ""
  SSO_AUTHORIZATION_URL: ""
  SSO_TOKEN_URL: ""
  SSO_INTROSPECTION_URL: ""
  MCP_HOST_ENDPOINT: ""
