apiVersion: apps/v1
kind: Deployment
metadata:
  name: okf-mcp-server
  labels:
    app: okf-mcp-server
    component: mcp-server
spec:
  replicas: 1
  # One pod at a time: the knowledge PVC may be ReadWriteOnce (one node).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: okf-mcp-server
      component: mcp-server
  template:
    metadata:
      labels:
        app: okf-mcp-server
        component: mcp-server
    spec:
      # Matches OpenShift's restricted-v2 SCC: any non-root UID, no escalation.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: okf-mcp-server
          image: okf-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "5001"
            - name: OKF_DATA_DIR
              value: /app/data/okf
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            # Non-secret settings (auth mode, SSO URLs, access policy) ...
            - configMapRef:
                name: okf-mcp-server-config
            # ... and secrets (SSO client secret, session secret, PostgreSQL).
            - secretRef:
                name: okf-mcp-server-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Published snapshots, written by the refresh CronJob; served read-only.
            - name: knowledge
              mountPath: /app/data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: knowledge
          persistentVolumeClaim:
            claimName: okf-mcp-server-knowledge
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
