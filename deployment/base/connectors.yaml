# What the refresh CronJob mirrors. Secrets come from okf-connector-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: okf-connectors
  labels:
    app: okf-mcp-server
    component: refresh
data:
  connectors.yaml: |
    mirror: /app/data/mirror
    sources:
      - name: share
        kind: fileshare
        path: /sources/share
        permissions: none
