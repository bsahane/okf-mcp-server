apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: okf-mcp-server-knowledge
  labels:
    app: okf-mcp-server
    component: mcp-server
spec:
  # The refresh CronJob writes snapshots (and the source mirror) here and the
  # server reads them. ReadWriteOnce works when both run on one node; on a
  # multi-node cluster use a ReadWriteMany storage class.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
