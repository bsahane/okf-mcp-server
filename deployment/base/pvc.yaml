apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: okf-mcp-server-knowledge
  labels:
    app: okf-mcp-server
    component: mcp-server
spec:
  # The refresh CronJob writes snapshots (and the source mirror) here and the
  # server reads them. With ReadWriteOnce the CronJob is pinned to the
  # server's node (pod affinity); a server restart during a long refresh can
  # wait for the Job to release the volume. ReadWriteMany removes both limits.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
