# Replace every value before deploying (or manage this Secret with your
# secret store and remove it from the kustomization).
apiVersion: v1
kind: Secret
metadata:
  name: okf-mcp-server-secrets
  labels:
    app: okf-mcp-server
    component: mcp-server
type: Opaque
stringData:
  SSO_CLIENT_SECRET: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME_GENERATE_SECURE_RANDOM_KEY"
  POSTGRES_USER: "okf"
  POSTGRES_PASSWORD: "CHANGE_ME"
