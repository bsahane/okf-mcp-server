# Plain Kubernetes (kind, k3s, OrbStack, EKS, GKE, AKS): the base without the
# OpenShift-only BuildConfig, ImageStream and Route. Build and push the image
# yourself and set it below; expose the Service with your Ingress/Gateway.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: okf-mcp-server
    newName: okf-mcp-server
    newTag: dev
patches:
  - target: {kind: Deployment, name: okf-mcp-server}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # Cloud disks (EBS, PD, Azure Disk) start root-owned: make the PVC group-writable.
      # (OpenShift's restricted-v2 SCC sets fsGroup itself, so this is not in base.)
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 0
  - target: {kind: CronJob, name: okf-refresh}
    patch: |
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroup
        value: 0
