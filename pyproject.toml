[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okf_mcp_server"]

[project]
name = "okf-mcp-server"
version = "0.1.0"
description = "MCP server for retrieval over Open Knowledge Format (OKF) bundles"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["mcp", "okf", "rag", "fastmcp", "fastapi"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==2.14.2",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "structlog==25.4.0",
    "python-dotenv==1.1.1",
    "fastapi==0.116.0",
    "uvicorn==0.35.0",
    "asyncpg==0.30.0",
    "psycopg==3.2.3",
    "itsdangerous==2.2.0",
    "requests-oauthlib==2.0.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
ingest = [
    "docling==2.95.0",
]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.16.8",
    "mypy==1.16.1",
    "pre-commit==4.2.0",
    "httpx==0.28.1",
    "langchain-google-genai==2.1.8",
    "langchain_mcp_adapters==0.1.8",
    "langgraph==0.5.4",
    "bandit==1.9.3",
    "safety",
    "pydocstyle",
    "types-PyYAML==6.0.12.20260906"
]

[project.scripts]
okf-mcp-server = "okf_mcp_server.src.main:main"
okf-ingest = "okf_mcp_server.src.ingest.cli:main"

[project.urls]
"Based on" = "https://github.com/redhat-data-and-ai/template-mcp-server/tree/286b9e7b732af9d58f9dfd9be68c071e55919ea4"

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["E", "W", "F", "I"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["okf_mcp_server"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "asyncio",
    "docling: requires the ingest extra (Docling)",
]

[tool.coverage.run]
source = ["okf_mcp_server"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    # Docling adapter is exercised by the separate ingestion CI job.
    "*/ingest/docling_adapter.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
